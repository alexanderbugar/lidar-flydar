[platformio]
src_dir = firmware/src
include_dir = firmware/include
test_dir = firmware/test
default_envs = s3

[env:s3]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
lib_deps = askuric/Simple FOC@2.3.5
monitor_speed = 921600

[env:s3_mpu]
extends = env:s3
build_flags = -DFLYDAR_MPU6050

[env:native]
platform = native
test_build_src = yes
build_flags = -std=c++17
build_src_filter = +<ld_lidar.cpp> +<fusion.cpp>

[env:s3_ota]
extends = env:s3
upload_protocol = espota
upload_port = lidar-flydar.local
upload_flags = --auth=${sysenv.FLYDAR_OTA_PASSWORD}
